<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>星座スロット占い</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#fff;background:#130e2b}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 15%,#53377e,transparent 45%),radial-gradient(circle at 90% 90%,#293b78,transparent 45%),#130e2b}.machine{width:min(92vw,480px);padding:36px 24px;text-align:center;border:2px solid #e4bc69;border-radius:28px;background:linear-gradient(145deg,#332354,#1a1637);box-shadow:0 20px 70px #080616aa,0 0 35px #dfae6440}h1{font-size:clamp(1.7rem,6vw,2.5rem);margin:4px 0 10px;color:#ffe2a0}.sub{color:#d4c8ef;margin:0 0 30px}.reels{display:flex;gap:10px;margin:20px 0;padding:14px;border-radius:18px;background:#0e0b23;border:2px solid #ae8ac9}.reel{flex:1;min-width:0;padding:24px 4px;border-radius:12px;background:linear-gradient(#fff9ec,#f3e3fa);color:#39275e;font-size:clamp(2.4rem,11vw,4rem);box-shadow:inset 0 0 12px #8b69a455}.spin{width:100%;padding:16px;border:0;border-radius:999px;background:linear-gradient(90deg,#f7c76b,#ffe5a2);color:#392143;font-size:1.2rem;font-weight:800;cursor:pointer;box-shadow:0 6px 0 #b98741}.spin:active{transform:translateY(4px);box-shadow:0 2px 0 #b98741}.spin:disabled{opacity:.7;cursor:wait}.result{min-height:90px;margin-top:25px;line-height:1.8}.result strong{font-size:1.45rem;color:#ffe2a0}.note{font-size:.8rem;color:#b8aed0;margin-top:25px}
</style>
</head>
<body><main class="machine"><div aria-hidden="true">✦ ✧ ✦</div><h1>🔮 星座スロット占い</h1><p class="sub">スロットを回して、今日の運勢を占おう！</p><div class="reels" aria-label="スロットの絵柄"><div class="reel" id="r1">🌙</div><div class="reel" id="r2">⭐</div><div class="reel" id="r3">☀️</div></div><button class="spin" id="spin">✦ スロットを回す ✦</button><div class="result" id="result" aria-live="polite">ボタンを押してスタート！</div><p class="note">今日の第1位は、おひつじ座 ♈</p></main>
<script>
const icons=['🌙','⭐','☀️','💎','🍀','💖','🔮'];const reels=[1,2,3].map(n=>document.getElementById('r'+n));const btn=document.getElementById('spin');const result=document.getElementById('result');const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
btn.addEventListener('click',async()=>{btn.disabled=true;result.textContent='運勢を占っています…';let timers=reels.map(el=>setInterval(()=>{el.textContent=icons[Math.floor(Math.random()*icons.length)]},75));for(let i=0;i<3;i++){await wait(650+i*350);clearInterval(timers[i]);reels[i].textContent='♈'}result.innerHTML='<strong>🎉 大当たり！ 🎉</strong><div>本日の第1位は… <strong>おひつじ座 ♈</strong></div><div>素敵な一日になりますように ✨</div>';btn.disabled=false;btn.textContent='↻ もう一度回す';});
</script></body></html>
